<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PSH Microbacias - Visualizador Geoespacial</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; }
        /* Adicione estilos para sidebar, legendas, etc. */
        .sidebar { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; z-index: 1000; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="sidebar">
        <!-- Controles: select para microbacias, checkboxes para layers -->
        <select id="microbacia-select" multiple>
            <!-- Options carregadas dinamicamente -->
        </select>
        <div id="layers-control">
            <!-- Checkboxes para camadas -->
        </div>
        <div id="legend"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <script>
        // Função de debounce para otimização
        function debounce(fn, ms) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), ms);
            };
        }

        // Inicializa mapa
        const map = L.map('map').setView([-25.5, -49.2], 8); // Centro no Paraná
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Outros basemaps
        const esriImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        // Adicione controle de layers

        let microbaciasLayer, otherLayers = {}; // Armazena layers

        // Função para carregar GeoJSON.gz
        async function loadGeoJSON(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Falha ao fetch ${url}: ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                const inflated = pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });
                return JSON.parse(inflated);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                alert('Erro ao carregar arquivo. Verifique console e servidor local.');
                return null;
            }
        }

        // Exemplo: Carregar microbacias
        async function initMicrobacias() {
            const geojson = await loadGeoJSON('data/microbacias.geojson.gz'); // Ajuste path
            if (!geojson) return;
            microbaciasLayer = L.geoJSON(geojson, {
                style: { color: '#00f', weight: 2, fillOpacity: 0 },
                onEachFeature: (feature, layer) => {
                    layer.bindPopup(`Microbacia: ${feature.properties.nome}`);
                }
            }).addTo(map);

            // Preencha select com options
            const select = document.getElementById('microbacia-select');
            geojson.features.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.properties.id; // Assuma ID
                opt.text = f.properties.nome;
                select.add(opt);
            });

            // Evento de filtro
            select.addEventListener('change', debounce(filterLayers, 300));
        }

        // Função de filtro otimizada com bbox
        function filterLayers() {
            const selectedIds = Array.from(document.getElementById('microbacia-select').selectedOptions).map(opt => opt.value);
            if (!selectedIds.length) return;

            const selectedFeatures = turf.featureCollection(microbaciasLayer.getLayers().filter(l => selectedIds.includes(l.feature.properties.id)).map(l => l.feature));
            const bbox = turf.bbox(selectedFeatures);

            // Zoom para bbox
            map.fitBounds([[bbox[1], bbox[0]], [bbox[3], bbox[2]]]);

            // Para cada layer ativa, clip com interseção
            Object.keys(otherLayers).forEach(key => {
                if (/* checkbox checked */) {
                    const layerGeo = otherLayers[key]; // Assuma carregado
                    const clipped = turf.intersect(layerGeo, selectedFeatures); // Ou union/multi
                    // Atualize layer no mapa
                    updateLayer(key, clipped);
                    updateStatsAndLegend(key, clipped);
                }
            });
        }

        // Função para atualizar stats (área, %)
        function updateStatsAndLegend(key, geojson) {
            if (!geojson) return;
            const area = turf.area(geojson) / 1e6; // km²
            console.log(`Área ${key}: ${area} km²`);
            // Atualize legenda DOM
            document.getElementById('legend').innerHTML += `<p>${key}: ${area} km²</p>`;
        }

        // Carregue outras camadas similarmente
        async function initOtherLayers() {
            // Ex: uso_solo = await loadGeoJSON('data/uso_solo.geojson.gz');
            // otherLayers['uso_solo'] = uso_solo;
            // Adicione checkboxes e events
        }

        // Verifique projeções (se necessário, adicione Proj4)
        // L.CRS.EPSG4674 or similar

        // Init
        initMicrobacias();
        initOtherLayers();
        map.on('zoomend moveend', debounce(updateStatsAndLegend, 200)); // Exemplo
    </script>
</body>
</html>
