<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSH - Programa de Segurança Hídrica | Visualizador de Microbacias</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="header-logos">
      <strong>PSH Microbacias</strong>
    </div>
    <button type="button" class="btn" id="fitAll">Ajustar visão</button>
    <div class="slider-row" role="group" aria-label="Opacidade das camadas">
      <label for="opacity">Opacidade</label>
      <input type="range" id="opacity" min="20" max="100" value="70" />
      <span id="opacityVal">70%</span>
    </div>
    <span class="version">Versão beta</span>
  </header>
  <div id="map" role="presentation"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
