<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programa de Segurança Hídrica - Diagnóstico Territorial</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

  <!-- Turf + Pako -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <img src="./assets/IDR_GOV_Seab_V_1.webp" alt="IDR-SEAB" class="logo"/>
    <div class="titles">
      <h1>Programa de Segurança Hídrica - PSH</h1>
      <div id="version">v1.1 (GitHub Pages fix)</div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button id="btn-fit">Ajustar visão</button>
      <label>Opacidade padrão <span id="opacity-val">70%</span>
        <input id="opacity" type="range" min="10" max="100" step="5" value="70" />
      </label>
    </div>
    <div id="map"></div>
    <aside class="panel">
      <h3>Camadas</h3>
      <label><input type="checkbox" data-layer="microbacias" checked> Microbacias</label>
      <label><input type="checkbox" data-layer="uso_solo" checked> Uso do Solo</label>
      <label><input type="checkbox" data-layer="conflitos" checked> Conflitos de Uso</label>
      <div class="hint">Os dados são carregados de <code>./data/*.geojson_part-*.gz</code>.</div>
    </aside>
  </main>

  <div id="errors" class="errors" hidden></div>

  <footer class="footer">IDR-Paraná © 2025</footer>

  <script type="module" src="./script.js"></script>
</body>
</html>
